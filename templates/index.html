<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>YouTube Video Clipper</title>
    <meta name="description" content="Download YouTube videos and create audio/video clips">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/styles.css">
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="YT Clipper">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 YouTube Video Clipper</h1>
            <button class="dark-mode-toggle" id="darkModeToggle" onclick="toggleDarkMode()">
                <span id="darkModeIcon">🌙</span>
            </button>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="YouTube URL or Video ID">
                <select id="videoQuality">
                    <option value="best">Best Quality</option>
                    <option value="1080">1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                    <option value="360">360p</option>
                </select>
                <button id="addVideoBtn">Add Video</button>
            </div>
            
            <div class="controls">
                <button id="recoverClipsBtn">Recover Clips (<span id="clipsSize">0</span> MB)</button>
                <button id="recoverAllBtn">Recover All (<span id="allSize">0</span> MB)</button>
            </div>
            
            <!-- Status messages area -->
            <div id="statusArea" class="status-area" style="display: none;">
                <div id="statusMessage" class="status-message"></div>
            </div>
        </div>

        <div class="library-section">
            <div class="library-header">
                <h2>VIDEO LIBRARY</h2>
                <div class="library-controls">
                    <button id="expandAllBtn">Expand All</button>
                    <button id="collapseAllBtn">Collapse All</button>
                </div>
            </div>
            <div id="videoLibrary" class="video-library">
                <!-- Video cards will be dynamically added here -->
            </div>
        </div>

        <div class="merge-section">
            <h2>MERGE SELECTED ITEMS</h2>
            
            <div class="merge-controls">
                <div class="merge-type-control">
                    <label><strong>Merge Type:</strong></label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="mergeType" value="audio_only" id="mergeTypeAudio" checked>
                            Audio Only (Fast)
                        </label>
                        <label>
                            <input type="radio" name="mergeType" value="video_only" id="mergeTypeVideo">
                            Video Only (Slow - Re-encodes)
                        </label>
                        <label>
                            <input type="radio" name="mergeType" value="both" id="mergeTypeBoth">
                            Both (Slowest - Re-encodes Video)
                        </label>
                    </div>
                </div>
                
                <div class="merge-gap-control" id="gapControl">
                    <label>
                        Gap between clips (Audio only):
                        <input type="number" id="gapSeconds" value="0.5" step="0.1" min="0" max="10">
                        seconds
                    </label>
                </div>

                <div class="merge-fade-control" id="fadeControl">
                    <label class="fade-checkbox">
                        <input type="checkbox" id="mergeFade">
                        <span>Add fade in/out to merged audio</span>
                    </label>
                    <label class="fade-duration">
                        Fade duration:
                        <input type="number" id="mergeFadeDuration" value="1" min="0.5" max="3" step="0.5">
                        seconds
                    </label>
                </div>

                <div class="merge-normalize-control" id="normalizeControl">
                    <label class="fade-checkbox">
                        <input type="checkbox" id="mergeNormalize">
                        <span>Normalize volume across clips (slower processing)</span>
                    </label>
                </div>
                
                <div class="merge-title-control">
                    <label>
                        <strong>Merge Title</strong> (optional - defaults to timestamp):
                        <input type="text" id="mergeTitle" placeholder="e.g., Final Lecture Compilation">
                    </label>
                </div>
            </div>
            
            <div id="mergePreview" class="merge-preview">
                <p class="no-selection">No items selected. Check items above and assign order numbers to merge.</p>
            </div>
            <button id="createMergeBtn" class="merge-btn" disabled>Create Merged Audio</button>
            <div id="mergedOutput" class="merged-output">
                <!-- Merged results will appear here -->
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
